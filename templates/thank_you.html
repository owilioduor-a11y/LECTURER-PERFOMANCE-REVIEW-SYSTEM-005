{% extends "base.html" %}

{% block title %}Thank You - Lecturer Review System{% endblock %}

{% block content %}
<div class="main-content">
    <div class="card text-center" style="max-width: 500px; margin: 3rem auto;">
        <div style="font-size: 3rem; margin-bottom: 1rem;">&#10003;</div>
        <h2>Thank You!</h2>
        <p class="text-muted mt-1">Your review has been recorded successfully.</p>
        <div class="mt-3" style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;">
            <a href="{{ url_for('student_dashboard') if session.get('is_student') else url_for('index') }}" class="btn btn-primary">
                Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
