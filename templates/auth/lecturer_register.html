{% extends "base.html" %}

{% block title %}Lecturer Registration - Lecturer Review System{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Lecturer Registration</h2>
            <p>Create an account to receive performance feedback</p>
        </div>

        <form method="post" action="{{ url_for('lecturer_register') }}">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" class="form-control"
                       placeholder="Enter your full name" required autofocus>
            </div>

            <div class="form-group">
                <label for="department">Department</label>
                <input type="text" id="department" name="department" class="form-control"
                       placeholder="e.g. Computer Science" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control"
                       placeholder="your.email@university.edu">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" class="form-control"
                       placeholder="+254 700 000 000">
            </div>

            <div class="form-group">
                <label for="pin">Staff PIN</label>
                <input type="password" id="pin" name="pin" class="form-control"
                       placeholder="Create a PIN (min 4 characters)" required
                       minlength="4" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="confirm_pin">Confirm PIN</label>
                <input type="password" id="confirm_pin" name="confirm_pin" class="form-control"
                       placeholder="Confirm your PIN" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn btn-primary">Register</button>
        </form>

        <div class="auth-link">
            Already have an account? <a href="{{ url_for('lecturer_login') }}">Log In</a>
        </div>
    </div>
</div>
{% endblock %}
